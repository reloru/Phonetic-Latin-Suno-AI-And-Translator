name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var "CF_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID" --var "COMMIT:$GITHUB_SHA"
      - name: Verify the live Worker serves this commit
        run: |
          for i in $(seq 1 20); do
            got=$(curl -fsS https://latin-suno.reloru.workers.dev/api/health | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"])' || true)
            if [ "$got" = "$GITHUB_SHA" ]; then echo "live: $got"; exit 0; fi
            echo "attempt $i: live commit is '$got'"; sleep 6
          done
          exit 1
